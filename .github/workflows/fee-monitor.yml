name: Fee source monitor

on:
  schedule:
    # Twice weekly — Monday and Thursday 14:00 UTC
    - cron: "0 14 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run fee source monitor
        run: node scripts/monitor-fee-sources.mjs

      - name: Commit snapshot + report when changed
        run: |
          git config user.name "fee-monitor-bot"
          git config user.email "fee-monitor@getllccostcalculator.com"
          git add data/fee-source-snapshot.json data/fee-monitor-report.json || true
          if git diff --staged --quiet; then
            echo "No snapshot/report changes to commit"
          else
            git commit -m "chore: update fee source monitor snapshot [skip ci]"
            git push
          fi

      - name: Open issue when sources change or fail
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/fee-monitor-report.json';
            if (!fs.existsSync(path)) {
              console.log('No report file');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const changed = report.changed || [];
            const unreachable = report.unreachable || [];
            if (changed.length === 0 && unreachable.length === 0) {
              console.log('No actionable changes');
              return;
            }
            const title = `Fee monitor: ${changed.length} changed, ${unreachable.length} unreachable (${report.generatedAt.slice(0,10)})`;
            const body = [
              '## Automated fee-source monitor report',
              '',
              report.summary,
              '',
              '### Changed source pages (review fees)',
              changed.length ? changed.map(s => `- [ ] \`${s}\``).join('\n') : '_None_',
              '',
              '### Unreachable sources',
              unreachable.length ? unreachable.map(s => `- [ ] \`${s}\``).join('\n') : '_None_',
              '',
              'Review official schedules and update `src/data/stateFees.ts` when published amounts change.',
              '',
              `_Generated by scripts/monitor-fee-sources.mjs_`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fee-monitor',
              per_page: 5,
            });
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['fee-monitor'],
              });
            }
